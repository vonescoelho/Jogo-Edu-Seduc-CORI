<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F7A8C">
<title>Atendimentos AEE</title>
<link rel="icon" href="logo-aee-192.png">
<style>
:root{--tinta:#15303A;--suave:#55707B;--mar:#0F7A8C;--areia:#F4F6F7;--linha:#DFE5E9}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--areia);color:var(--tinta);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.cartao{max-width:520px;width:100%;background:#fff;border:1px solid var(--linha);border-radius:24px;padding:32px 28px;text-align:center;
  box-shadow:0 1px 1px rgba(21,48,58,.04),0 12px 32px rgba(21,48,58,.08)}
img{width:84px;height:84px;border-radius:22px}
h1{font-size:1.5rem;margin:18px 0 10px}
p{margin:0 0 14px;line-height:1.6;color:var(--suave);text-align:justify;text-align-last:center}
a.botao{display:inline-block;margin-top:8px;padding:16px 26px;border-radius:16px;background:var(--mar);color:#fff;font-weight:800;font-size:1.08rem;text-decoration:none}
small{display:block;margin-top:22px;color:var(--suave);font-size:.8rem}
</style>
</head>
<body>
<main>
  <div class="cartao">
    <img src="logo-aee-192.png" alt="">
    <h1>Esta versão foi encerrada</h1>
    <p>A Plataforma de Atendimentos AEE não está mais disponível neste aplicativo.</p>
    <small>SENOV Educacional</small>
  </div>
</main>
<script>
/* desliga o aplicativo antigo */
try{ if("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(l=>l.forEach(r=>{ if(r.scope.indexOf("/Jogo-Edu-Seduc-CORI/")>=0 || r.scope.toLowerCase().indexOf("/jogo-edu-seduc-cori/")>=0) r.unregister(); })); }catch(e){}
</script>
</body>
</html>
